name: CI

on:
  push:
    branches: [main, developer]
  pull_request:
    branches: [main, developer]

jobs:
  # La puerta de calidad: type-check de los DOS proyectos, lint, la suite pura y
  # las tres guardas de documentación, versión y capas, más el build de
  # producción. En matriz porque este código tiene casos de PLATAFORMA —las
  # rutas se parten por los dos separadores, la fuente de un tema se resuelve
  # con path.sep solo en win32— y probarlos en un solo sistema es no probarlos.
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci
      - run: npm run compile

  # Aparte de la puerta a propósito: descarga un VS Code y lanza un extension
  # host de verdad, que es un minuto largo que cada build no puede pagar. Una
  # vez por sistema.
  integration:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Integration (Linux, under Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration

      - name: Integration (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration
